name: Deploy Cloudflare Jobs Worker

on:
  push:
    branches:
      - feat/cloudflare-free-runtime
    paths:
      - .github/workflows/deploy-cloudflare-jobs.yml
      - package.json
      - package-lock.json
      - wrangler.jobs.jsonc
      - cloudflare/jobs/**
      - cloudflare/migrations/**
      - lib/cloudflare/**
      - lib/google/**
      - lib/crypto.ts

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate jobs binding types
        run: npx wrangler@4.125.0 types --config wrangler.jobs.jsonc --env-interface CloudflareJobsEnv cloudflare-jobs-env.d.ts

      - name: Apply D1 migrations
        run: npx wrangler@4.125.0 d1 migrations apply gdm --remote --config wrangler.jobs.jsonc

      - name: Deploy jobs Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.125.0
          command: deploy --config wrangler.jobs.jsonc

# Triggered after deterministic Cloudflare lockfile refresh.
