name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Tests
        run: npm test
        env:
          GDM_INTEGRATION_TESTS: "1"
          MONGODB_URI: mongodb://127.0.0.1:27017/drive-migrator-ci
          REDIS_URL: redis://127.0.0.1:6379
          TOKEN_ENCRYPTION_KEY: ci-token-encryption-key
          GOOGLE_API_KEY: AIza-ci-placeholder
          GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-google-client-secret

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-nextauth-secret
          TOKEN_ENCRYPTION_KEY: ci-token-encryption-key
          GOOGLE_API_KEY: AIza-ci-placeholder
          GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          MONGODB_URI: mongodb://127.0.0.1:27017/drive-migrator-ci
          REDIS_URL: redis://127.0.0.1:6379

      - name: Build production web image
        run: docker build --target production -t gdm-web-ci .

      - name: Build production worker image
        run: docker build --target worker -t gdm-worker-ci .
