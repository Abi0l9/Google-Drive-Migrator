name: Validate Cloudflare Web Runtime

on:
  push:
    branches:
      - feat/cloudflare-free-runtime
      - feat/gdm-branding
    paths:
      - .github/workflows/validate-cloudflare-web.yml
      - app/**
      - auth.ts
      - components/**
      - public/**
      - cloudflare/migrations/**
      - lib/cloudflare/**
      - lib/google/**
      - lib/crypto.ts
      - lib/migration/**
      - types/**
      - next.config.ts
      - open-next.config.ts
      - wrangler.jsonc
      - wrangler.jobs.jsonc
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_API_KEY: AIza-ci-placeholder
      GOOGLE_PICKER_API_KEY: AIza-ci-picker-placeholder
      GOOGLE_CLOUD_PROJECT_NUMBER: "123456789012"
      GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      NEXTAUTH_SECRET: ci-nextauth-secret-with-sufficient-length
      NEXTAUTH_URL: https://gdm-web.realk9sh.workers.dev
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-with-sufficient-length
      ADMIN_EMAILS: admin@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Scan web surface for legacy runtime imports
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -R -nE '@/lib/db|@/models/|@/lib/queue/migrations|@/lib/rate-limit|@/lib/google/drive"|@/lib/google/user-auth"' app auth.ts components 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Legacy runtime imports remain in the web surface"
            exit 1
          fi
          echo "Web surface is free of MongoDB/Redis/BullMQ/googleapis runtime imports"

      - name: Generate web Worker binding types
        run: npx wrangler@4.125.0 types --config wrangler.jsonc --env-interface CloudflareEnv cloudflare-env.d.ts

      - name: Generate jobs Worker binding types
        run: npx wrangler@4.125.0 types --config wrangler.jobs.jsonc --env-interface CloudflareJobsEnv cloudflare-jobs-env.d.ts

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Next production build
        run: npm run build

      - name: OpenNext Cloudflare build
        run: npm run cf:build

      - name: Wrangler dry-run and bundle size
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.125.0 deploy --config wrangler.jsonc --dry-run --outdir .wrangler-dry
          echo "OpenNext worker file:"
          ls -lh .open-next/worker.js
          echo "Dry-run output:"
          find .wrangler-dry -maxdepth 2 -type f -printf '%p %k KiB\n' | sort
