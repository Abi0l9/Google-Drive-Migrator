name: Restore package lockfile

on:
  push:
    branches:
      - fix/restart-migration-core

permissions:
  contents: write

jobs:
  restore-lockfile:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[lockfile-sync]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/restart-migration-core

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Audit locked production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "[lockfile-sync] Restore audited package lock"
          git push origin HEAD:fix/restart-migration-core
